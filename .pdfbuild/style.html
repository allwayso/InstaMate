<style>
@page { size: A4; margin: 16mm 14mm; }
* { box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "微软雅黑", "Segoe UI", "SimSun", sans-serif;
  font-size: 10.5pt; line-height: 1.6; color: #1a1a1a; margin: 0;
}
h1 { font-size: 19pt; text-align: center; margin: 0 0 6pt; letter-spacing: 1px; }
h2 {
  font-size: 13.5pt; margin: 16pt 0 8pt; padding: 4pt 8pt;
  border-left: 4px solid #c0392b; background: #f6f6f6;
  page-break-after: avoid;
}
h3 { font-size: 11.5pt; margin: 12pt 0 6pt; color: #c0392b; page-break-after: avoid; }
h4 { font-size: 11pt; margin: 10pt 0 5pt; page-break-after: avoid; }
p { margin: 5pt 0; }
blockquote {
  margin: 6pt 0; padding: 7pt 10pt; background: #fbf7e8;
  border-left: 3px solid #d4a72c; color: #333;
}
blockquote p { margin: 0; }
table {
  width: 100%; border-collapse: collapse; margin: 8pt 0;
  font-size: 9.5pt; page-break-inside: avoid;
}
th, td { border: 1px solid #bbb; padding: 4pt 6pt; vertical-align: top; }
th { background: #ececec; font-weight: 600; text-align: left; }
strong { color: #000; }
hr { border: none; border-top: 1px solid #ddd; margin: 12pt 0; }
ul, ol { margin: 5pt 0; padding-left: 20pt; }
li { margin: 3pt 0; }
code { background: #f0f0f0; padding: 0 3px; border-radius: 2px; font-family: Consolas, monospace; font-size: 9.5pt; }
</style>
